# 시도·시군구 → 법정동코드 앞부분. 질문의 지역 이름을 자물쇠의 legalDongCode 앞부분과 비교할 때 쓴다.
#
# 출처: 행정표준코드관리시스템(https://www.code.go.kr) '법정동코드 전체자료'(2026-10-01자)에서
#       존재하는 시도·시군구 행만 추출했다 (원본 전체는 저장소에 두지 않는다).
# sido.code: 앞 2자리, sigungu.prefix: 앞 5자리. 구가 있는 시(수원시 등)는 구들의 공통 앞 4자리다.
# aliases: 질문에서 쓰는 약칭 (사람이 정함). 시·군 이름에서 '시'·'군'을 뗀 말은 읽는 쪽에서 만든다.
# 같은 이름이 여러 곳에 있다(중구, 서구, 고성 등) — 읽는 쪽이 사용자 자물쇠에 있는 지역만 인정한다.

