# 기능3 CLIP zero-shot 무드 태깅용 후보 목록.
#
# clip: CLIP 텍스트 인코더에 넣을 라벨. 반드시 영어로 쓴다 — 한국어 라벨은
#       실측 결과 사진과 무관하게 다 8~11%대로 뭉쳐서 구분이 안 됨(CLIP이
#       영어 위주로 학습됨). 영어는 같은 조건에서 1위-2위 차이가 뚜렷했음
#       (예: "indoor office" 20.8 vs 2위 16.1).
# ko:   API 응답(moodTags)에 노출할 한국어 표시명. 검색어로 그대로 쓰지 않는다
#       (예: "sunset"→"석양"으로 직역해서 검색하면 제목에 "석양" 들어간 곡만
#       걸림). 실제 검색어는 query_rewriter가 별도로 만든다.
#
# 2026-09-25 실측: 14개 태그를 각각 정면으로 겨냥한 사진으로 테스트했더니
# night street(밤거리)·narrow alley(골목)·dawn early morning(새벽)·
# festival party lights(파티) 4개가 단 한 번도 1등을 못 함 — 개념이 겹치는
# 다른 태그(도시야경/실내/노을/콘서트)한테 매번 밀려서 삭제. CLIP이 구분
# 못 하는 태그는 늘려도 소용없고 줄이는 게 맞다고 판단.
tags:
  - clip: sunset
    ko: 노을
  - clip: cafe interior
    ko: 카페
  - clip: cozy indoor room
    ko: 실내
  - clip: nature greenery forest
    ko: 자연
  - clip: beach sea ocean
    ko: 바다
  - clip: snow winter scene
    ko: 눈
  - clip: city night view skyline
    ko: 도시야경
  - clip: rainy day
    ko: 비오는날
  - clip: mountain hiking trail
    ko: 산
  - clip: concert live music stage
    ko: 콘서트
