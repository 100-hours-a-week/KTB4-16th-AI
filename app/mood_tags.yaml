# 기능3 CLIP zero-shot 무드 태깅용 후보 목록.
#
# clip: CLIP 텍스트 인코더에 넣을 라벨. 반드시 영어로 쓴다 — 한국어 라벨은
#       실측 결과 사진과 무관하게 다 8~11%대로 뭉쳐서 구분이 안 됨(CLIP이
#       영어 위주로 학습됨). 영어는 같은 조건에서 1위-2위 차이가 뚜렷했음
#       (예: "indoor office" 20.8 vs 2위 16.1).
# ko:   API 응답(moodTags)에 노출할 한국어 표시명. 검색어로 그대로 쓰지 않는다
#       (예: "sunset"→"석양"으로 직역해서 검색하면 제목에 "석양" 들어간 곡만
#       걸림). 실제 검색어는 query_rewriter가 별도로 만든다.
tags:
