# aliases: 사용자가 부를 만한 다른 이름. 이름·별칭은 전체에서 고유해야 한다.
# radius_km: 항목에 있으면 유형 기본값 대신 쓴다.
# 반경은 초기값이다 — 시험 질문으로 조정한다.
# '# 확인 필요' 주석이 붙은 항목은 지도에서 위치를 확인한 뒤 주석을 지운다.
