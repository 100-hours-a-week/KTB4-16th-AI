# 기능5 기억 검색 — 질문에서 계절·날씨·기온·기분·곡 무드를 뽑는 규칙.
#
# words: 질문에 이 말이 있으면 해당 조건으로 본다. 공백은 있어도 없어도 된다("비 오" = "비오").
#        단어 앞에 한글이 바로 붙어 있으면 잡지 않는다 ("준비가"가 "비가"로 잡히지 않게).
#        뒤는 제한하지 않는다 ("추웠"이 "추웠던"을 잡는다). 너무 짧은 말은 오탐이 나므로 구문으로 쓴다.
# 같은 말을 두 규칙이 가질 때를 위해 위에서부터 차례로 찾고, 한 번 잡힌 글자는 다시 쓰지 않는다.
#   → 기분(사용자 자신의 기분)이 곡 무드("우울한 노래")보다 먼저다.
#
# 아래 구간·단어는 첫 버전이다. 시험 질문으로 고친다.

# 계절은 달로만 판단한다 (기온으로 판단하지 않는다).
seasons:
  봄:
    months: [3, 4, 5]
    words: [봄, 초봄, 늦봄]
  여름:
    months: [6, 7, 8]
    words: [여름, 한여름, 초여름, 늦여름]
  가을:
    months: [9, 10]
    words: [가을, 초가을, 늦가을]
  겨울:
    months: [11, 12, 1, 2]
    words: [겨울, 한겨울, 초겨울, 늦겨울]

# conditions: records.weather_condition 값 (CLEAR, CLOUDY, OVERCAST, RAIN, SNOW, RAIN_SNOW, SHOWER)
weather:
  - label: 비 오는 날
    conditions: [RAIN, RAIN_SNOW, SHOWER]
    words: ["비 오", "비가", "비 내", "빗속", "빗길", "빗소리", "소나기", "장마"]
  - label: 눈 오는 날
    conditions: [SNOW, RAIN_SNOW]
    words: ["눈 오", "눈이 오", "눈 내", "눈이 내", "함박눈", "눈 쌓"]
  - label: 맑은 날
    conditions: [CLEAR]
    words: ["맑은 날", "맑았던 날", "화창", "날씨 좋"]
  - label: 흐린 날
    conditions: [CLOUDY, OVERCAST]
    words: ["흐린 날", "흐렸던", "구름 낀", "구름 많"]

# range: 기록 당시 기온(섭씨) 범위. 임시 구간이다.
# 곡 태그 "따뜻한"과 겹치지 않게 "따뜻한 날"처럼 날씨 말과 함께 쓴 것만 기온으로 본다.
temperature:
  - label: 추운 날
    range: [-50, 5]
    words: ["추웠", "추운 날", "추울 때", "한파", "영하", "꽁꽁"]
  - label: 쌀쌀한 날
    range: [6, 15]
    words: ["쌀쌀", "선선"]
  - label: 따뜻한 날
    range: [16, 25]
    words: ["따뜻한 날", "따뜻했던 날", "포근한 날"]
  - label: 더운 날
    range: [26, 60]
    words: ["더웠", "더운 날", "무더", "폭염", "찜통"]

# 사용자가 직접 입력한 기분 점수(records.mood_score, -50~50)로 비교한다. 구간은 임시값이다.
# 기분 점수의 의미(0이 보통인지 등)는 백엔드·프론트에 확인이 필요하다.
mood:
  - label: 기분이 안 좋았던 때
    range: [-50, -20]
    words:
      - 우울했
      - 우울할 때
      - 우울한 날
      - 우울해서
      - 슬펐
      - 슬플 때
      - 슬픈 날
      - 힘들었
      - 힘들 때
      - 힘든 날
      - 지쳤
      - 지칠 때
      - 외로웠
      - 외로울 때
      - 속상했
      - 기분이 안 좋
      - 기분 안 좋
      - 기분이 나빴
  - label: 기분이 좋았던 때
    range: [20, 50]
    words:
      - 행복했
      - 행복할 때
      - 행복한 날
      - 기분이 좋
      - 기분 좋
      - 설렜
      - 설렐 때
      - 신났
      - 즐거웠
      - 뿌듯했

# 곡 무드 태그 (track_moods.moods, 12종). 곡이 이 태그를 가진 기록에 해당한다.
# 위 기분·기온 규칙이 먼저 글자를 가져가므로, 여기엔 "곡이 어떤 느낌인지"를 말할 때만 남는다.
song_moods:
  신나는: [신나는, 신나게, 흥겨운]
  잔잔한: [잔잔]
  슬픈: [슬픈, 슬프]
  몽환적인: [몽환]
  따뜻한: [따뜻한, 따듯한]
  웅장한: [웅장]
  경쾌한: [경쾌]
  우울한: [우울한, 우울]
  설레는: [설레는, 설렘]
  차분한: [차분]
  그리운: [그리운, 그리워, 그리움]
  화려한: [화려]
