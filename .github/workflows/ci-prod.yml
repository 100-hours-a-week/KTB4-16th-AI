name: AI CI prod

# main 브랜치 전용 CI. PR 검증, push 시 프로덕션 이미지 릴리즈까지만 한다.
# 프로덕션 배포는 cd-prod.yml이 이 워크플로가 성공하면 이어서 한다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: AI CI prod pull_request
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2. Ruff 설치 + 린트 검사
      - name: Ruff 실행
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

      # 3. Ruff로 포맷 검사
      - name: Run Ruff Formatter Check
        run: ruff format --check .

      # 4. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 5. 애플리케이션 의존성 설치
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 6. 컴파일
      - name: Check Python syntax
        run: python -m compileall .

      # 7. 테스트 실행 중 커버리지 측정
      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: ci-test
        run: coverage run -m pytest

      # 8. 커버리지 60% 미만이면 여기서 실패
      - name: Coverage verification
        run: |
          coverage report --fail-under=60
          coverage xml

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  pr-notify:
    name: Discord notification (prod PR)
    runs-on: ubuntu-latest
    needs: pr-ci

    # CI가 실패해도 알림 작업 실행
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions: {}

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Send CI result to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "AI CI 결과 알림"
        env:
          DISCORD_USERNAME: MURO_BOT
          DISCORD_EMBEDS: |
            [
              {
                "title": "AI main CI: ${{ needs.pr-ci.result }}",
                "description": ${{ toJSON(github.event.pull_request.title) }},
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": ${{ needs.pr-ci.result == 'success' && 3066993 || 15158332 }},
                "fields": [
                  {
                    "name": "PR",
                    "value": "[#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})",
                    "inline": true
                  },
                  {
                    "name": "작성자",
                    "value": ${{ toJSON(github.event.pull_request.user.login) }},
                    "inline": true
                  },
                  {
                    "name": "작업 브랜치",
                    "value": ${{ toJSON(github.head_ref) }},
                    "inline": true
                  },
                  {
                    "name": "대상 브랜치",
                    "value": ${{ toJSON(github.base_ref) }},
                    "inline": true
                  }
                ]
              }
            ]

  main-ci:
    if: github.event_name == 'push'
    name: AI CI prod release
    runs-on: ubuntu-latest
    concurrency:
      group: ai-main-release
      cancel-in-progress: false
    
    # 워크플로우 권한 정의
    permissions:
      contents: write      # Git 태그, Release 생성
      id-token: write      # GCP Workload Identity와 통신하기 위한 OIDC 토큰 발행 권한
      
    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        with:
            fetch-depth: 0
            
      # 2. Ruff 설치 + 린트 검사  
      - name: Ruff 실행
        uses: astral-sh/ruff-action@v3
        with:
            args: "check"

      
      # 3. Ruff로 포맷 검사
      - name: Run Ruff Formatter Check
        run: ruff format --check .
        

      # 4. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 5. 애플리케이션 의존성 설치
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 6. 컴파일
      - name: Check Python syntax
        run: python -m compileall .

      # 7. 테스트 실행 중 커버리지 측정
      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: ci-test
        run: coverage run -m pytest

      # 8. 커버리지 60% 미만이면 여기서 실패
      - name: Coverage verification
        run: |
          coverage report --fail-under=60
          coverage xml

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
      
      # Phase 1: semantic-release 실행 환경 구성
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # Phase 2: Docker Build 준비
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Phase 3: OIDC를 이용한 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      # Phase 4: gcloud 명령어 사용 준비
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        

      # Phase 5: Docker가 GCP 인증 정보를 사용하도록 연결
      - name: Configure Docker authentication
        run: |
            gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      # Phase 6: 버전 계산 -> image build, push -> Git 태그, Release 생성
      - name: Release AI image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          cp release.config.main.json .releaserc.json
          npx --yes \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            semantic-release

  main-notify:
    name: Discord notification (prod release)
    runs-on: ubuntu-latest
    needs: main-ci

    # CI가 실패해도 알림 작업 실행
    if: ${{ always() && github.event_name == 'push' }}
    permissions: {}

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Send CI result to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "AI main CI 결과 알림"
        env:
          DISCORD_USERNAME: MURO_BOT
          DISCORD_EMBEDS: |
            [
              {
                "title": "AI CI: ${{ needs.main-ci.result }}",
                "description": ${{ toJSON(github.event.head_commit.message || '커밋 메시지 없음') }},
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": ${{ needs.main-ci.result == 'success' && 3066993 || 15158332 }},
                "fields": [
                  {
                    "name": "커밋",
                    "value": "[커밋 확인](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                    "inline": true
                  },
                  {
                    "name": "푸시한 사람",
                    "value": ${{ toJSON(github.actor) }},
                    "inline": true
                  },
                  {
                    "name": "브랜치",
                    "value": ${{ toJSON(github.ref_name) }},
                    "inline": true
                  }
                ]
              }
            ]
