name: AI CD prod

# CI prod가 main에서 성공하면 자동으로 시작한다. production 승인자가 승인해야 배포가 진행된다.
# 배포 방식(2026-11-23 변경): 이미지는 CI가 ECR에 올려 두었고, 여기서는 16-mulo-kube의 ai values.yaml의
# 이미지 태그만 바꿔서 main에 올린다. 실제 배포(롤링 업데이트)는 클러스터의 ArgoCD가 Git 변화를 보고 한다.
# 새 릴리스가 없거나(태그가 안 생긴 머지) 지금 운영 중인 태그와 같으면 건너뛴다.
# workflow_dispatch는 특정 태그로 재배포하거나 이전 버전으로 되돌릴 때 수동으로 쓴다. (같은 태그여도 커밋한다)
on:
  workflow_run:
    workflows: ["AI CI prod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그 (예: 1.18.1). ECR에 있는 태그여야 한다"
        required: true
        type: string

env:
  SERVICE: ai
  KUBE_REPO: 100-hours-a-week/16-mulo-kube
  VALUES_FILE: mulo/ai/chart/values.yaml

jobs:
  # ============================================================
  # 1단계: 배포할 태그를 정한다. (아무것도 바꾸지 않는다)
  # 자동 실행이면 CI가 만든 릴리스 태그(vX.Y.Z)를 그 커밋에서 읽는다. semantic-release는 이미지를
  # push한 뒤에 태그를 만드니, 태그가 있으면 ECR에 이미지도 있다.
  # ============================================================
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      deploy: ${{ steps.tag.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG#v}"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          fi
          if [ -z "$TAG" ]; then
            echo "이 커밋에 릴리스 태그가 없어서 배포하지 않습니다."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "태그 형식이 올바르지 않습니다: $TAG (예: 1.18.1)"
            exit 1
          fi
          echo "배포할 태그: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Notify result
        if: ${{ failure() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "AI 배포 준비"
          status: ${{ job.status }}

  # ============================================================
  # 2단계: 16-mulo-kube의 이미지 태그를 바꾼다.
  # environment: production 에 지정한 승인자가 승인해야 시작한다.
  # KUBE_DEPLOY_KEY: 16-mulo-kube의 쓰기 가능한 배포 키(개인 키). production 환경 시크릿으로 등록한다.
  # ============================================================
  update-tag:
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # 모든 서비스가 같은 저장소 main에 커밋하므로, 같은 서비스끼리만 순서를 맞춘다. 충돌은 아래 재시도로 푼다.
      group: cd-ai-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.image_tag }}
      EVENT: ${{ github.event_name }}
    steps:
      # 알림 액션을 쓰려고 이 저장소의 .github/actions만 받는다.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout kube repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KUBE_REPO }}
          ref: main
          # 16-mulo-kube에 쓰기 권한(--allow-write)으로 등록한 배포 키. 사람 계정에 묶이지 않고 만료도 없다.
          ssh-key: ${{ secrets.KUBE_DEPLOY_KEY }}
          path: kube

      - id: bump
        name: Update image tag
        working-directory: kube
        run: |
          # image: 아래 tag 줄(들여쓰기 2칸)이 정확히 하나여야 한다.
          if [ "$(grep -cE '^  tag: ' "$VALUES_FILE")" != "1" ]; then
            echo "$VALUES_FILE 에서 tag 줄을 하나로 찾지 못했습니다."
            exit 1
          fi
          CUR=$(sed -nE 's/^  tag: "?([^"#]*)"?.*$/\1/p' "$VALUES_FILE" | tr -d ' ')
          echo "현재 운영 태그: $CUR, 배포할 태그: $TAG"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$TAG" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "같은 태그라서 건너뜁니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s/^(  tag: ).*$/\1\"$TAG\"/" "$VALUES_FILE"
          # 바뀐 줄이 정확히 한 줄인지 확인한다. (같은 태그로 수동 실행하면 변화가 없을 수 있다)
          CHANGED=$(git diff --numstat -- "$VALUES_FILE" | awk '{print $1+$2}')
          if [ -z "$CHANGED" ]; then
            echo "변경 사항이 없어서 커밋하지 않습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHANGED" != "2" ]; then
            echo "예상한 한 줄 변경이 아닙니다."; git diff; exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: ${{ steps.bump.outputs.changed == 'true' }}
        working-directory: kube
        env:
          CUR: ${{ steps.bump.outputs.current }}
          SRC_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(${SERVICE}): ${CUR} -> ${TAG} (${GITHUB_REPOSITORY}@${SRC_SHA::7})"
          # 다른 서비스의 CD가 동시에 커밋할 수 있어서, 밀리면 다시 받아서 붙이고 재시도한다.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "푸시 완료. ArgoCD가 이 변경을 받아 배포한다."
              exit 0
            fi
            echo "푸시 실패($i). 최신을 받아 다시 시도합니다."
            git pull --rebase origin main
            sleep $((i * 3))
          done
          echo "푸시를 5번 시도했지만 실패했습니다."
          exit 1

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "AI 배포(태그 갱신)"
          status: ${{ job.status }}
          description: "태그: ${{ needs.prepare.outputs.image_tag }} (ArgoCD가 이어서 배포)"
