name: AI CD

on:
  workflow_run:
    workflows: ["AI CI main"]
    types: [completed]
  workflow_dispatch:

env:
  ZONE: asia-northeast3-a

jobs:
  # 스모크 테스트는 CI 쪽 테스트 코드로 대체하기로 해서 여기선 배포만 한다.
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      standby_vm: ${{ steps.standby.outputs.vm }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 1. 현재 Standby VM 판별
      - id: standby
        run: |
          VM=$(gcloud compute instances list \
            --filter="labels.role=standby" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          echo "vm=$VM" >> "$GITHUB_OUTPUT"

      # 2. CI가 방금 push한 최신 이미지 태그 조회
      - id: image
        run: |
          TAG=$(gcloud artifacts docker images list \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}" \
            --include-tags --sort-by="~UPDATE_TIME" --limit=1 \
            --format="value(TAGS)" | cut -d',' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 3. ai.env 생성 (GitHub Secrets 값으로)
      - run: |
          cat > ai.env <<ENVEOF
          APP_ENV=${{ secrets.APP_ENV }}
          INTERNAL_TOKEN=${{ secrets.INTERNAL_TOKEN }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AI_CLIENT_MODE=${{ secrets.AI_CLIENT_MODE }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          TEXT_EMBEDDING_MODEL=${{ secrets.TEXT_EMBEDDING_MODEL }}
          TEXT_EMBEDDING_DIM=${{ secrets.TEXT_EMBEDDING_DIM }}
          REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
          CLIP_MODEL=${{ secrets.CLIP_MODEL }}
          CLIP_EMBEDDING_DIM=${{ secrets.CLIP_EMBEDDING_DIM }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          BACKEND_MYSQL_URL=${{ secrets.BACKEND_MYSQL_URL }}
          BACKEND_INTERNAL_URL=${{ secrets.BACKEND_INTERNAL_URL }}
          RUN_WORKER=false
          ENVEOF

      # 4. Standby VM에 env 전송 + ai 컨테이너만 새 이미지로 교체
      - run: |
          gcloud compute scp ai.env "${{ steps.standby.outputs.vm }}:~/app/ai.env" \
            --zone="${{ env.ZONE }}" --tunnel-through-iap

          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=${{ steps.image.outputs.tag }} &&
            docker compose pull ai &&
            docker compose up -d ai
          "

  switch-traffic:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 6~8. 현재 Active VM 판별 → 고정 IP를 Standby로 이전 → 라벨 교체
      - run: |
          ACTIVE_VM=$(gcloud compute instances list \
            --filter="labels.role=active" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          STANDBY_VM="${{ needs.deploy.outputs.standby_vm }}"

          # ACTIVE와 STANDBY가 같으면 이미 전환됐거나 오래된 승인 요청이다 — 라벨/IP를 망가뜨리지 않도록 중단한다.
          if [ "$ACTIVE_VM" = "$STANDBY_VM" ]; then
            echo "ACTIVE_VM과 STANDBY_VM이 동일합니다 ($ACTIVE_VM). 이미 전환되었거나 오래된 승인 요청일 수 있어 중단합니다."
            exit 1
          fi

          # 새 운영 VM 워커 켜기 — 아직 트래픽을 안 받는 상태라 재시작해도 서비스 영향 없음.
          # IMAGE_TAG는 deploy job의 SSH 세션에서만 export됐고 여긴 새 세션이라 비어있으므로,
          # 재pull 없이 그 VM이 지금 실제로 돌리고 있는 이미지 태그를 그대로 읽어서 재사용한다.
          gcloud compute ssh "$STANDBY_VM" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=\$(docker inspect ai --format='{{.Config.Image}}' | cut -d: -f2) &&
            sed -i 's/^RUN_WORKER=.*/RUN_WORKER=true/' ai.env &&
            docker compose up -d --force-recreate ai
          "

          gcloud compute instances delete-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"

          # Cloud NAT 미도입 상태라 standby가 자체 임시 외부 IP를 갖고 있을 수 있다.
          # 고정 IP를 붙이기 전에 기존 access-config를 먼저 제거한다 (없으면 무시하고 진행).
          gcloud compute instances delete-access-config "$STANDBY_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" || true

          gcloud compute instances add-access-config "$STANDBY_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" \
            --address="${{ secrets.MURO_PROD_IP }}"

          gcloud compute instances add-labels "$STANDBY_VM" --zone="${{ env.ZONE }}" --labels=role=active
          gcloud compute instances add-labels "$ACTIVE_VM" --zone="${{ env.ZONE }}" --labels=role=standby

          # 방금 standby가 된 VM(옛 active)은 고정 IP를 뗀 채로 남는다.
          # Cloud NAT이 없는 상태라 이대로 두면 다음 배포 때 이미지 pull이 안 되므로,
          # 임시(ephemeral) 외부 IP를 다시 붙여서 인터넷 접속을 유지시켜준다.
          gcloud compute instances add-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"

          # 옛 운영 VM 워커 끄기 — 이미 트래픽이 빠진 상태라 재시작해도 서비스 영향 없음.
          # 여기도 새 세션이라 IMAGE_TAG가 비어있으므로, 이 VM이 지금 돌리고 있는(옛) 이미지
          # 태그를 그대로 읽어서 재사용한다 — 새로 배포된 태그로 실수로 덮어쓰지 않기 위함이다.
          gcloud compute ssh "$ACTIVE_VM" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=\$(docker inspect ai --format='{{.Config.Image}}' | cut -d: -f2) &&
            (grep -q '^RUN_WORKER=' ai.env && sed -i 's/^RUN_WORKER=.*/RUN_WORKER=false/' ai.env || echo 'RUN_WORKER=false' >> ai.env) &&
            docker compose up -d --force-recreate ai
          "
