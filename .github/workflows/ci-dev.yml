name: AI CI dev

# develop 브랜치 PR 검증만 한다.
# 개발 환경(GCP 개발 VM)이 없어져서 개발 이미지 릴리즈와 개발 배포(cd-dev)는 없앴다. (2026-11-23)
on:
  pull_request:
    branches:
      - develop

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: AI CI dev pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2. Ruff 설치 + 린트 검사
      - name: Ruff 실행
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

      # 3. Ruff로 포맷 검사
      - name: Run Ruff Formatter Check
        run: ruff format --check .

      # 4. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 5. 애플리케이션 의존성 설치
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 6. 컴파일
      - name: Check Python syntax
        run: python -m compileall .

      # 7. 테스트 실행 중 커버리지 측정
      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: ci-test
        run: coverage run -m pytest

      # 8. 커버리지 60% 미만이면 여기서 실패
      - name: Coverage verification
        run: |
          coverage report --fail-under=60
          coverage xml

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "AI CI dev pull_request"
          status: ${{ job.status }}
