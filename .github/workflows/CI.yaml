name: AI CI develop

on:
  pull_request:
    branches:
      - develop

jobs:
  ci:
    name: AI CI
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
            
      # 2. Ruff 설치 + 린트 검사  
      - name: Ruff 실행
        uses: astral-sh/ruff-action@v3
        with:
            args: "check"

      
      # 3. Ruff로 포맷 검사
      - name: Run Ruff Formatter Check
        run: ruff format --check .
        

      # 4. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # 5. 애플리케이션 의존성 설치
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 6. 컴파일
      - name: Check Python syntax
        run: python -m compileall .
        
  notify:
      name: Discord notification
      runs-on: ubuntu-latest
      needs: ci

      # CI가 실패해도 알림 작업 실행
      if: ${{ always() }}
      permissions: {}

      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      steps:
        - name: Send CI result to Discord
          if: ${{ env.DISCORD_WEBHOOK != '' }}
          uses: Ilshidur/action-discord@0.3.2
          with:
            args: "AI CI 결과 알림"
          env:
            DISCORD_USERNAME: MURO_BOT
            DISCORD_EMBEDS: |
              [
                {
                  "title": "AI develop CI: ${{ needs.ci.result }}",
                  "description": ${{ toJSON(github.event.pull_request.title) }},
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": ${{ needs.ci.result == 'success' && 3066993 || 15158332 }},
                  "fields": [
                    {
                      "name": "PR",
                      "value": "[#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})",
                      "inline": true
                    },
                    {
                      "name": "작성자",
                      "value": ${{ toJSON(github.event.pull_request.user.login) }},
                      "inline": true
                    },
                    {
                      "name": "작업 브랜치",
                      "value": ${{ toJSON(github.head_ref) }},
                      "inline": true
                    },
                    {
                      "name": "대상 브랜치",
                      "value": ${{ toJSON(github.base_ref) }},
                      "inline": true
                    }
                  ]
                }
              ]
