<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사진 정답 확인</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;max-width:1040px;margin:0 auto;
padding:0 16px 40px;color:#222}
#bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 0;z-index:5}
#bar button{margin-right:8px;padding:6px 12px;font-size:14px}
section{display:flex;gap:16px;margin:16px 0;padding:12px;border:1px solid #ddd;border-radius:8px}
section.done{background:#f3faf4;border-color:#b6dfba}
img{width:300px;max-width:38%;height:auto;object-fit:contain;align-self:flex-start;border-radius:4px}
.body{flex:1;min-width:0}h3{margin:0 0 6px}small{font-weight:normal;color:#777}
fieldset{margin:6px 0;padding:6px 10px;border:1px solid #e3e3e3;border-radius:6px}
legend{font-size:13px;color:#555}
label.opt{display:inline-block;margin:2px 10px 2px 0;font-size:14px;white-space:nowrap}
.hint{font-size:12px;color:#999}.confirm{margin-top:8px;font-weight:bold}
</style>
<div id="bar">
  <b id="progress"></b>
  <button onclick="exportJson()">정답 파일 내보내기</button>
  <button onclick="resetAll()">내 수정 지우고 초안으로 되돌리기</button>
  <span class="hint">수정은 이 브라우저에 자동 저장됩니다. 끝나면 내보내기 → data/photo_eval/gold_labels.json 으로 저장하세요.</span>
</div>
<p>Claude가 쓴 <b>초안</b>입니다. 사진을 보고 맞게 고친 뒤 카드마다 <b>"확인함"</b>을 체크하세요.
장소를 모두 비우면 "목록에 맞는 곳 없음"이라는 뜻입니다. 사진이 진짜 사진이면 대상·분위기를,
그림·짤이면 표정·감정을 고르고 나머지는 비웁니다.</p>
<div id="cards"></div>
<script>
const DATA = __DATA__;
const KEY = "photo_eval_gold_v1";
let state = JSON.parse(JSON.stringify(DATA.labels));
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) for (const id in saved) if (state[id]) state[id] = saved[id];
} catch (e) {}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  updateBar();
}
function updateBar() {
  const total = DATA.items.length;
  const done = DATA.items.filter(i => state[i.id].confirmed).length;
  document.getElementById("progress").textContent = "확인 " + done + " / " + total;
  document.querySelectorAll("section").forEach(s => {
    s.classList.toggle("done", state[s.dataset.id].confirmed);
  });
}
function toggle(id, attr, value, checked) {
  const list = state[id][attr] || [];
  const without = list.filter(v => v !== value);
  state[id][attr] = checked ? without.concat([value]) : without;
  save();
}
function makeGroup(item, attr) {
  const box = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = attr + " (최대 " + DATA.limits[attr] + "개)";
  box.appendChild(legend);
  DATA.vocab[attr].forEach(value => {
    const label = document.createElement("label");
    label.className = "opt";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = (state[item.id][attr] || []).includes(value);
    input.onchange = () => toggle(item.id, attr, value, input.checked);
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + value));
    box.appendChild(label);
  });
  return box;
}
function makeCard(item) {
  const section = document.createElement("section");
  section.dataset.id = item.id;
  const img = document.createElement("img");
  img.src = item.uri;
  img.alt = item.id;
  const body = document.createElement("div");
  body.className = "body";
  const title = document.createElement("h3");
  title.textContent = item.id + " ";
  const small = document.createElement("small");
  small.textContent = item.label + " · " + state[item.id].split;
  title.appendChild(small);
  body.appendChild(title);
  DATA.attrs.forEach(attr => body.appendChild(makeGroup(item, attr)));
  const confirm = document.createElement("label");
  confirm.className = "confirm";
  const check = document.createElement("input");
  check.type = "checkbox";
  check.checked = !!state[item.id].confirmed;
  check.onchange = () => { state[item.id].confirmed = check.checked; save(); };
  confirm.appendChild(check);
  confirm.appendChild(document.createTextNode(" 확인함"));
  body.appendChild(confirm);
  section.appendChild(img);
  section.appendChild(body);
  return section;
}
function exportJson() {
  const doc = { "_설명": DATA.note, labels: state };
  const blob = new Blob([JSON.stringify(doc, null, 1) + "\n"], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "gold_labels.json";
  link.click();
}
function resetAll() {
  if (!confirm("지금까지 이 브라우저에서 한 수정을 모두 지우고 초안으로 되돌릴까요?")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
}
const cards = document.getElementById("cards");
DATA.items.forEach(item => cards.appendChild(makeCard(item)));
updateBar();
</script>
</html>
