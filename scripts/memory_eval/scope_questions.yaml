# 기능5 기억 검색 — 범위 판정(scope) 평가용 문장 102개 (초안)
#
# 목적: route 노드가 '자물쇠(기억 검색)와 관련 있는 질문인가'를 맞히는지 잰다.
#       튜닝용(tune)과 최종 보고용(final)을 나눠 둔다. 설정·예시 문장은 tune으로만 고치고,
#       보고 숫자는 final에서 뽑는다.
#
# 칸
#   id        문장 번호
#   label     in = 기억 검색으로 처리해야 함 / out = 막고 안내해야 함
#   category  in:  condition(조건) semantic(코멘트 의미) photo(사진) typo(오타·띄어쓰기) hard(애매·짧은 말)
#             out: general(일반 질문·잡담) other_feature(추천·재생·삭제 등 다른 기능) ranking(순위·통계) unsafe(유해·주입)
#   split     tune(조정용) / final(최종용)
#   text      문장. 실제 말투로 자유롭게 고쳐도 된다 (label은 그대로)
#   confirm   true면 라벨이 애매해서 janie 확인이 필요한 문장
#
# 라벨 기준 (확인 필요)
#   - '추천해줘'처럼 추천을 요청하는 말이 있으면 과거형(들은)이 섞여도 out (추천 기능 안내).
#     단 '추천해준·추천받은'처럼 이미 지난 일을 말하는 형태는 in
#   - 순위·통계 질문(ranking)은 통계를 지원하지 않기로 해서 out. 안내 문구는 '지원하지 않아요'
#   - 조건이 하나도 없는 아주 짧은 말(노래 보여줘, 성수동)은 in으로 둠 (정상 질문을 막는 것이 더 큰 실수이므로)
#
# 주 지표: in 문장을 out으로 잘못 막은 수(오차단, 0이 목표). 그 다음이 out 문장 차단율.

